<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantrack — Öğrenci Takip & Koçluk Platformu</title>

  <!-- Google Fonts: Plus Jakarta Sans (body), Space Grotesk (display), JetBrains Mono (data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN + Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- Hallmark Design System: tokens.css + style.css -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">

  <!-- Dynamic Sidebar Width & Theme Initialization (Flicker-prevention script) -->
  <style id="sidebar-dynamic-width"></style>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('plantrack_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        var savedWidth = localStorage.getItem('plantrack_sidebar_width');
        if (savedWidth) {
          document.getElementById('sidebar-dynamic-width').textContent =
            '#sidebar { width: ' + savedWidth + 'px !important; min-width: ' + savedWidth + 'px !important; max-width: ' + savedWidth + 'px !important; }';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="h-screen w-screen flex overflow-hidden font-sans">

  <!-- Sidebar: Tactile Technical Instrument -->
  <aside id="sidebar">
    <!-- Bölüm 1: Logo & Başlık -->
    <div class="p-3.5 border-b border-[var(--color-rule)] flex items-center justify-between gap-3">
      <div id="sidebar-logo-btn" class="flex items-center gap-2.5 cursor-pointer group">
        <img src="assets/logo.svg" alt="Plantrack Logo" class="w-8 h-8 rounded-[var(--radius-sm)] transition-transform group-hover:scale-105 shrink-0">
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 leading-none">
            <span class="font-display font-bold text-base tracking-tight text-[var(--color-ink)] group-hover:text-[var(--color-accent)] transition-colors">Plantrack</span>
            <span class="text-[9px] font-mono px-1 py-0.5 rounded-[var(--radius-xs)] bg-[var(--color-paper-3)] text-[var(--color-ink-faint)] border border-[var(--color-rule)] font-semibold">v1.0</span>
          </div>
          <!-- Aktif Öğrenci Modül Rozeti -->
          <div id="sidebar-modul-badge" class="hidden mt-1">
            <span id="sidebar-modul-text" class="meta-pill text-[10px] text-[var(--color-success)] bg-[var(--color-success-bg)] border-[var(--color-success-border)]"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bölüm 2: Navigasyon -->
    <nav class="flex-1 overflow-y-auto px-2.5 py-4 space-y-5">
      <!-- Grup 1: Yönetim Paneli -->
      <div>
        <div class="nav-group-title">Yönetim Paneli</div>
        <div class="space-y-0.5">
          <button data-nav="overview" class="nav-item active">
            <div class="flex items-center gap-2.5">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
              <span>Ana Panel</span>
            </div>
            <span id="nav-badge-overview" class="badge-count">0</span>
          </button>

          <button data-nav="cockpit" class="nav-item">
            <div class="flex items-center gap-2.5">
              <i data-lucide="gauge" class="w-4 h-4"></i>
              <span>Öğrenci Kokpiti</span>
            </div>
            <span id="nav-badge-cockpit" class="badge-count badge-danger hidden">0</span>
          </button>
        </div>
      </div>

      <!-- Grup 2: Takip & Planlama -->
      <div>
        <div class="nav-group-title">Takip & Planlama</div>
        <div class="space-y-0.5">
          <button data-nav="matrix" class="nav-item">
            <div class="flex items-center gap-2.5">
              <i data-lucide="calendar-days" class="w-4 h-4"></i>
              <span>Çalışma & Ödev Matrisi</span>
            </div>
          </button>

          <button data-nav="tasks" class="nav-item">
            <div class="flex items-center gap-2.5">
              <i data-lucide="check-square" class="w-4 h-4"></i>
              <span>Ödev Geçmişi</span>
            </div>
            <span id="nav-badge-tasks" class="badge-count badge-accent hidden">0</span>
          </button>
        </div>
      </div>

      <!-- Grup 3: Raporlar & Çıktılar -->
      <div>
        <div class="nav-group-title">Raporlar & Çıktılar</div>
        <div class="space-y-0.5">
          <button data-nav="report" class="nav-item">
            <div class="flex items-center gap-2.5">
              <i data-lucide="file-text" class="w-4 h-4"></i>
              <span>Raporlar</span>
            </div>
            <span class="meta-pill">A4 Karne</span>
          </button>

          <button data-nav="hata-defteri" class="nav-item">
            <div class="flex items-center gap-2.5">
              <i data-lucide="book-open" class="w-4 h-4"></i>
              <span>Hata Defteri</span>
            </div>
            <span class="meta-pill">A4 & Analiz</span>
          </button>

          <button data-nav="cizelge-robotu" class="nav-item">
            <div class="flex items-center gap-2.5">
              <i data-lucide="bot" class="w-4 h-4"></i>
              <span>Çizelge Robotu</span>
            </div>
            <span class="meta-pill">A4 Şablon</span>
          </button>
        </div>
      </div>

      <!-- Grup 4: Havuz & Portföy -->
      <div>
        <div class="nav-group-title">Havuz & Portföy</div>
        <div class="space-y-0.5">
          <button data-nav="curriculum-pool" class="nav-item">
            <div class="flex items-center gap-2.5">
              <i data-lucide="library" class="w-4 h-4"></i>
              <span>Müfredat & Dersler</span>
            </div>
          </button>

          <button data-nav="library" class="nav-item">
            <div class="flex items-center gap-2.5">
              <i data-lucide="layers" class="w-4 h-4"></i>
              <span>Kaynaklar</span>
            </div>
          </button>

          <button data-nav="students" class="nav-item">
            <div class="flex items-center gap-2.5">
              <i data-lucide="users" class="w-4 h-4"></i>
              <span>Öğrenci Portföyü</span>
            </div>
          </button>
        </div>
      </div>

      <!-- Grup 5: Araçlar & Analiz -->
      <div>
        <div class="nav-group-title">Araçlar & Analiz</div>
        <div class="space-y-0.5">
          <button data-nav="sinav-notlari" class="nav-item">
            <div class="flex items-center gap-2.5">
              <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
              <span>Sınav Notları</span>
            </div>
          </button>
        </div>
      </div>
    </nav>

    <!-- Bölüm 3: Alt Kısım -->
    <div class="p-2.5 border-t border-[var(--color-rule)] space-y-2 bg-[var(--color-paper-2)]">
      <!-- Yerel Depolama & Tema Değiştirici -->
      <div class="flex items-center justify-between px-2 py-1 bg-[var(--color-paper-3)] rounded-[var(--radius-sm)] border border-[var(--color-rule)]">
        <div class="flex items-center gap-1.5">
          <button id="btn-toggle-theme" class="p-1 rounded-[var(--radius-xs)] text-[var(--color-ink-faint)] hover:text-[var(--color-ink)] hover:bg-[var(--color-paper-4)] transition-colors cursor-pointer" title="Temayı Değiştir (Açık/Koyu)">
            <i id="theme-toggle-icon" data-lucide="sun" class="w-3.5 h-3.5"></i>
          </button>
          <span class="text-[10px] font-mono text-[var(--color-ink-faint)]">Yerel Depolama</span>
        </div>
        <div class="flex items-center gap-1">
          <button id="btn-sidebar-import-json" class="p-1 rounded-[var(--radius-xs)] text-[var(--color-ink-faint)] hover:text-[var(--color-ink)] hover:bg-[var(--color-paper-4)] transition-colors cursor-pointer" title="JSON Yedek Yükle">
            <i data-lucide="upload" class="w-3.5 h-3.5"></i>
          </button>
          <button id="btn-export-backup" class="p-1 rounded-[var(--radius-xs)] text-[var(--color-ink-faint)] hover:text-[var(--color-ink)] hover:bg-[var(--color-paper-4)] transition-colors cursor-pointer" title="JSON Yedek İndir">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- Koç Kartı -->
      <div id="btn-open-coach-settings" onclick="App.openCoachSettingsModal()" class="flex items-center justify-between p-2 rounded-[var(--radius-sm)] bg-[var(--color-paper-3)] hover:bg-[var(--color-paper-4)] border border-[var(--color-rule)] transition-colors cursor-pointer group">
        <div class="flex items-center gap-2.5 min-w-0">
          <div id="sidebar-coach-avatar" class="w-7 h-7 rounded-[var(--radius-xs)] bg-[var(--color-accent)] text-[var(--color-ink)] flex items-center justify-center text-xs font-mono font-bold shrink-0">EK</div>
          <div class="min-w-0 leading-tight">
            <div id="sidebar-coach-name" class="text-xs font-semibold text-[var(--color-ink)] truncate group-hover:text-[var(--color-accent)] transition-colors">Eren Kaya</div>
            <div id="sidebar-coach-title" class="text-[10px] text-[var(--color-ink-faint)] truncate">Eğitim Koçu</div>
          </div>
        </div>
        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5 text-[var(--color-ink-faint)] group-hover:text-[var(--color-ink)] transition-colors shrink-0"></i>
      </div>
    </div>
  </aside>

  <!-- Sidebar Resizer -->
  <div id="sidebar-resizer" title="Genişliği ayarlamak için sürükleyin, sıfırlamak için çift tıklayın"></div>

  <!-- Sağ Ana Alan: Topbar + Main İçerik -->
  <div class="flex-1 flex flex-col h-full overflow-hidden bg-[var(--color-paper)]">
    <!-- Topbar (overview sayfasında gizli, diğer sayfalarda görünür) -->
    <header id="topbar" class="hidden h-14 px-6 flex items-center justify-between shrink-0 z-10">
      <!-- Sol Taraf: Öğrenci Seçici & Rozet -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
          <i data-lucide="user-check" class="w-4 h-4 text-[var(--color-accent)]"></i>
          <select id="select-active-student" class="select-instrument">
            <option value="">Öğrenci Seçilmedi</option>
          </select>
        </div>
        <span id="active-student-badge" class="hidden meta-pill text-[var(--color-accent)] bg-[var(--color-accent-subtle)] border-[var(--color-accent-border)] font-medium"></span>
      </div>

      <!-- Sağ Taraf: Gecikme Uyarısı & Hızlı Yeni Görev Butonu -->
      <div class="flex items-center gap-3">
        <button id="topbar-overdue-alert" class="hidden flex items-center gap-2 px-2.5 py-1 rounded-[var(--radius-sm)] bg-[var(--color-danger-bg)] text-[var(--color-danger)] border border-[var(--color-danger-border)] hover:opacity-90 text-xs font-medium transition-all cursor-pointer" title="Geciken Ödevler">
          <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>
          <span><span id="topbar-overdue-count">0</span> Geciken Ödev</span>
        </button>

        <button id="btn-quick-new-task" onclick="App.openTaskModal()" class="btn-tactile btn-tactile-primary">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>Hızlı Ödev Ekle</span>
        </button>
      </div>
    </header>

    <!-- Main İçerik (Görünümler) -->
    <main id="main-content" class="flex-1 h-full overflow-hidden relative">
      <section id="view-overview" class="view-section w-full h-full overflow-y-auto"></section>
      <section id="view-cockpit" class="view-section hidden w-full h-full overflow-y-auto"></section>
      <section id="view-matrix" class="view-section hidden w-full h-full overflow-y-auto"></section>
      <section id="view-tasks" class="view-section hidden w-full h-full overflow-y-auto"></section>
      <section id="view-report" class="view-section hidden w-full h-full overflow-y-auto"></section>
      <section id="view-hata-defteri" class="view-section hidden w-full h-full overflow-y-auto"></section>
      <section id="view-cizelge-robotu" class="view-section hidden w-full h-full overflow-y-auto"></section>
      <section id="view-curriculum-pool" class="view-section hidden w-full h-full overflow-y-auto"></section>
      <section id="view-library" class="view-section hidden w-full h-full overflow-y-auto"></section>
      <section id="view-students" class="view-section hidden w-full h-full overflow-y-auto"></section>
      <section id="view-sinav-notlari" class="view-section hidden w-full h-full overflow-y-auto"></section>
    </main>
  </div>

  <!-- Modal Yapısı -->
  <div id="modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div id="modal-container" class="bg-[var(--color-paper-2)] border border-[var(--color-rule-strong)] rounded-[var(--radius-lg)] max-w-lg w-full overflow-hidden shadow-2xl">
      <div id="modal-content" class="p-6"></div>
    </div>
  </div>

  <!-- Gizli Dosya Yükleme Inputu -->
  <input type="file" id="input-import-json" class="hidden" accept=".json">

  <!-- Yazdırma Alanı & Dinamik Sayfa Stili (PrintEngine) -->
  <div id="print-area" class="hidden"></div>
  <style id="print-page-style"></style>

  <!-- Script Yükleme Sırası: data.js -> store.js -> app.js -->
  <script src="js/data.js?v=7.1"></script>
  <script src="js/store.js?v=7.1"></script>
  <script src="app.js?v=7.1"></script>
</body>
</html>
